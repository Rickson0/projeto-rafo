[project]
name = "projetorafo"
version = "0.1.0"
description = "Dashboard interativo de RAFO do Brandon Sanderson"
readme = "README.md"
authors = [
    { name = "Rickson0", email = "ricksonkeu@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5.6",
    "lxml>=6.1.3",
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "requests>=2.34.2",
    "ruff>=0.16.10",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.65.0",
    "textblob>=0.20.1",
    "wordcloud>=1.9.6",
]

[project.scripts]
projetorafo = "projetorafo:main"

[project.optional-dependencies]
# Dependências pesadas — só usadas no build (scripts/build.py)
build = [
    "scikit-learn>=1.5.0",
    "bertopic>=0.16.0",
    "pyarrow>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.marimo.runtime]
auto_instantiate = true
